<rect x="980" y="330" width="320" height="16" rx="8" fill="#333"/>
<rect x="980" y="330" width="0" height="16" rx="8" fill="url(#g)">
<animate attributeName="width" values="0;320" dur="2.5s" fill="freeze"/>
</rect>
<text x="980" y="370" class="m" font-size="18">System Status: READY</text>
</g>

<!-- bottom cards -->
<g>
<rect x="60" y="440" width="470" height="360" rx="18" fill="#111827" stroke="url(#g)"/>
