<text x="95" y="690" class="m" font-size="22">Status</text><text x="360" y="690" fill="#22c55e" font-size="24">OPEN TO WORK</text>
</g>

<g>
<rect x="560" y="440" width="470" height="360" rx="18" fill="#111827" stroke="url(#g)"/>
<text x="585" y="480" class="t" font-size="28">🚀 CURRENT MISSION</text>
<text x="590" y="550" class="m" font-size="24">Building Industry-Level</text>
