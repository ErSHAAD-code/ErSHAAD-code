<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#09090f"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8b5cf6"/>
<stop offset="50%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#ec4899"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
.t{font-family:'Segoe UI',Arial,sans-serif;fill:#fff}
.s{font-family:Consolas,monospace;fill:#d1fae5}
.m{fill:#9ca3af;font-family:'Segoe UI'}
</style>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<rect x="20" y="20" width="1560" height="860" rx="22" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)">
<animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
</rect>

<circle cx="55" cy="55" r="8" fill="#ff5f56"/>
<circle cx="80" cy="55" r="8" fill="#ffbd2e"/>
<circle cx="105" cy="55" r="8" fill="#27c93f"/>
<text x="135" y="60" class="m" font-size="22">Developer Dashboard</text>

<circle cx="1470" cy="55" r="7" fill="#22c55e">
<animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
</circle>
<text x="1488" y="60" fill="#22c55e" font-size="18">ONLINE</text>

<!-- cards -->
<g>
