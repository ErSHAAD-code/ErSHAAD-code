<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0B1023"/>
      <stop offset="100%" stop-color="#151F38"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7A5CFF" stroke-opacity="0.08"/>
    </pattern>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="250" cy="180" r="180" fill="url(#cyanGlow)"/>
  <circle cx="1380" cy="720" r="220" fill="url(#purpleGlow)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="310" cy="210" r="1"/>
    <circle cx="510" cy="110" r="1.4"/>
    <circle cx="820" cy="140" r="1.2"/>
    <circle cx="1180" cy="90" r="1.3"/>
    <circle cx="1450" cy="160" r="1"/>
    <circle cx="210" cy="710" r="1.2"/>
    <circle cx="630" cy="780" r="1"/>
    <circle cx="980" cy="650" r="1.3"/>
    <circle cx="1490" cy="810" r="1.2"/>
  </g>

  <!-- Glass window -->
  <rect x="80" y="70" width="1440" height="760" rx="28"
        fill="#0B1023" fill-opacity="0.55"
        stroke="url(#border)" stroke-width="2.5"
        filter="url(#glow)"/>

  <!-- title bar -->
  <rect x="80" y="70" width="1440" height="62" rx="28"
        fill="#0F172A" fill-opacity="0.9"/>
  <rect x="80" y="104" width="1440" height="28" fill="#0F172A"/>

  <circle cx="120" cy="101" r="8" fill="#FF5F56"/>
  <circle cx="146" cy="101" r="8" fill="#FFBD2E"/>
  <circle cx="172" cy="101" r="8" fill="#27C93F"/>

  <text x="250" y="108"
        fill="#E5F4FF"
        font-size="28"
        font-family="Inter,Segoe UI,Arial"
        font-weight="700">
      Developer OS Session Summary
  </text>

  <rect x="1270" y="84" width="190" height="34" rx="17"
        fill="#102A1D" stroke="#27C93F"/>

  <circle cx="1292" cy="101" r="5" fill="#27C93F"/>
  <text x="1308" y="107"
        fill="#B8FFD0"
        font-size="18"
        font-family="Inter,Segoe UI,Arial"
        font-weight="700">
        SYSTEM READY
  </text>

  <text x="800" y="220"
        text-anchor="middle"
        fill="#EAF8FF"
        font-size="54"
        font-family="Inter,Segoe UI,Arial"
        font-weight="800">
      STAGE 1 FOUNDATION
  </text>

  <text x="800" y="270"
        text-anchor="middle"
        fill="#8FB8D8"
        font-size="24"
        font-family="Inter,Segoe UI,Arial">
      Cyberpunk background • Glass UI • macOS window • Neon frame
  </text>

  <rect x="170" y="320" width="1260" height="420" rx="20"
        fill="#FFFFFF" fill-opacity="0.02"
        stroke="#00D9FF" stroke-opacity="0.25"
        stroke-dasharray="10 8"/>

  <text x="800" y="545"
        text-anchor="middle"
        fill="#4DEBFF"
        font-size="34"
        font-family="Consolas, monospace">
      Workspace Reserved for Stage 2 / Stage 3 / Stage 4
  </text>

  <text x="800" y="805"
        text-anchor="middle"
        fill="#6B7FA3"
        font-size="18"
        font-family="Inter,Segoe UI,Arial">
      Developer OS v4.0 • Stage 1 Base Layout
  </text>
</svg>
