<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#09090f">
      <animate attributeName="stop-color" values="#09090f;#111827;#09090f" dur="12s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#1a1033"/>
  </linearGradient>

  <linearGradient id="accent" x1="0%" y1="0%" x2="100%">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="50%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#ec4899"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .title{font:700 66px 'Segoe UI',sans-serif;fill:white}
    .sub{font:600 26px 'Segoe UI',sans-serif;fill:#4fd1ff}
    .txt{font:20px 'Segoe UI',sans-serif;fill:#d1d5db}
    .mono{font:18px Consolas,monospace;fill:#baf7d0}
  </style>
</defs>

<rect width="1600" height="560" fill="url(#bg)"/>

<g opacity=".08" stroke="#44dfff">
<path d="M0 80H1600"/><path d="M0 160H1600"/><path d="M0 240H1600"/>
<path d="M0 320H1600"/><path d="M0 400H1600"/><path d="M0 480H1600"/>
<path d="M200 0V560"/><path d="M400 0V560"/><path d="M600 0V560"/>
<path d="M800 0V560"/><path d="M1000 0V560"/><path d="M1200 0V560"/><path d="M1400 0V560"/>
</g>

<rect x="18" y="18" width="1564" height="524" rx="22"
fill="none" stroke="url(#accent)" stroke-width="2" filter="url(#glow)">
<animate attributeName="stroke-opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/>
</rect>

<circle cx="55" cy="52" r="7" fill="#ff5f56"/>
<circle cx="80" cy="52" r="7" fill="#ffbd2e"/>
<circle cx="105" cy="52" r="7" fill="#27c93f"/>

<text x="135" y="58" class="txt">Developer OS v2.0</text>

<circle cx="1465" cy="52" r="6" fill="#22c55e">
<animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
</circle>
<text x="1480" y="58" fill="#22c55e" class="txt">ONLINE</text>

<text x="800" y="170" text-anchor="middle" class="title" filter="url(#glow)">MOHD SHAAD</text>
<text x="800" y="215" text-anchor="middle" class="sub">Software Engineer • Java Developer • Backend Enthusiast</text>
<text x="800" y="252" text-anchor="middle" class="txt">Building scalable software &amp; AI-powered solutions.</text>

<text x="800" y="295" text-anchor="middle" class="txt">Technology Arsenal</text>

<g>
<text x="360" y="340" class="txt">JAVA</text>
<rect x="360" y="350" width="200" height="10" rx="5" fill="#222"/>
<rect x="360" y="350" width="185" height="10" rx="5" fill="url(#accent)"/>

<text x="610" y="340" class="txt">SPRING BOOT</text>
<rect x="610" y="350" width="200" height="10" rx="5" fill="#222"/>
<rect x="610" y="350" width="175" height="10" rx="5" fill="url(#accent)"/>

<text x="860" y="340" class="txt">REACT</text>
<rect x="860" y="350" width="200" height="10" rx="5" fill="#222"/>
<rect x="860" y="350" width="165" height="10" rx="5" fill="url(#accent)"/>

<text x="1110" y="340" class="txt">PYTHON</text>
<rect x="1110" y="350" width="200" height="10" rx="5" fill="#222"/>
<rect x="1110" y="350" width="180" height="10" rx="5" fill="url(#accent)"/>
</g>

<text x="800" y="410" text-anchor="middle" class="txt">Currently Building</text>
<text x="800" y="445" text-anchor="middle" class="mono">Industry-Level Software Engineering Projects</text>

<text x="560" y="500" class="mono">✓ Backend</text>
<text x="710" y="500" class="mono">✓ Full Stack</text>
<text x="900" y="500" class="mono">✓ AI</text>
<text x="1010" y="500" class="mono">✓ Cloud</text>

</svg>
