<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#09090f"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6"/>
<stop offset="50%" stop-color="#22D3EE"/>
<stop offset="100%" stop-color="#EC4899"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
.t{font-family:'Segoe UI',Arial,sans-serif}
</style>
</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<g opacity=".08" stroke="#6ee7ff">
<path d="M0 100H1600"/><path d="M0 200H1600"/><path d="M0 300H1600"/><path d="M0 400H1600"/>
<path d="M200 0V500"/><path d="M400 0V500"/><path d="M600 0V500"/><path d="M800 0V500"/>
<path d="M1000 0V500"/><path d="M1200 0V500"/><path d="M1400 0V500"/>
</g>

<rect x="20" y="20" width="1560" height="460" rx="22" fill="none" stroke="url(#accent)" stroke-width="2" filter="url(#glow)">
<animate attributeName="stroke-opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
</rect>

<circle cx="55" cy="55" r="7" fill="#ff5f56"/>
<circle cx="80" cy="55" r="7" fill="#ffbd2e"/>
<circle cx="105" cy="55" r="7" fill="#27c93f"/>

<text x="135" y="60" fill="#9CA3AF" font-size="20" class="t">Developer OS v1.0</text>

<circle cx="1470" cy="55" r="7" fill="#22C55E">
<animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
</circle>
<text x="1488" y="60" fill="#22C55E" font-size="18" class="t">ONLINE</text>

<text x="800" y="180" text-anchor="middle" fill="white" class="t"
font-size="68" font-weight="700" filter="url(#glow)">
MOHD SHAAD
</text>

<text x="800" y="230" text-anchor="middle" fill="#22D3EE" class="t" font-size="26">
Software Engineer • Data Engineer • Data Analyst
</text>

<text x="800" y="275" text-anchor="middle" fill="#C084FC"
font-family="Consolas,monospace" font-size="22">
Initializing Developer Environment...
</text>

<rect x="500" y="300" width="600" height="14" rx="7" fill="#222"/>
<rect x="500" y="300" width="0" height="14" rx="7" fill="url(#accent)">
<animate attributeName="width" values="0;600" dur="3s" fill="freeze"/>
</rect>

<text x="800" y="340" text-anchor="middle" fill="#E5E7EB"
font-family="Consolas,monospace" font-size="18">
Loading Modules...
</text>

<text x="700" y="390" fill="#A7F3D0" font-family="Consolas,monospace" font-size="18">✓ Java Loaded</text>
<text x="700" y="420" fill="#A7F3D0" font-family="Consolas,monospace" font-size="18">✓ Spring Boot Loaded</text>
<text x="980" y="390" fill="#A7F3D0" font-family="Consolas,monospace" font-size="18">✓ React Loaded</text>
<text x="980" y="420" fill="#A7F3D0" font-family="Consolas,monospace" font-size="18">✓ SQL Loaded</text>

</svg>
