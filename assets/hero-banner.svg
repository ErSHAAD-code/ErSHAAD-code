<svg
width="1600"
height="500"
viewBox="0 0 1600 500"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#09090f"/>

<stop offset="100%" stop-color="#111827"/>

</linearGradient>

<linearGradient id="border" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#7C3AED"/>

<stop offset="50%" stop-color="#06B6D4"/>

<stop offset="100%" stop-color="#EC4899"/>

</linearGradient>

<filter id="shadow">

<feDropShadow
dx="0"
dy="0"
stdDeviation="12"
flood-color="#7C3AED"
flood-opacity="0.45"/>

</filter>

<filter id="glow">

<feDropShadow
dx="0"
dy="0"
stdDeviation="6"
flood-color="#22D3EE"
flood-opacity="0.9"/>

</filter>

</defs>

<rect
width="1600"
height="500"
fill="url(#bg)"/>

<rect
x="22"
y="22"
width="1556"
height="456"
rx="18"
stroke="url(#border)"
stroke-width="3"
filter="url(#shadow)"
fill="transparent"/>

<circle
cx="55"
cy="52"
r="8"
fill="#FF5F56"/>

<circle
cx="83"
cy="52"
r="8"
fill="#FFBD2E"/>

<circle
cx="111"
cy="52"
r="8"
fill="#27C93F"/>

<text

x="145"

y="58"

fill="#94A3B8"

font-size="20"

font-family="Segoe UI">

Developer OS v4.0

</text>

<circle
cx="1480"
cy="52"
r="8"
fill="#22C55E">

<animate

attributeName="opacity"

values="1;0.2;1"

dur="1.3s"

repeatCount="indefinite"/>

</circle>

<text

x="1500"

y="58"

fill="#22C55E"

font-size="18"

font-family="Segoe UI">

ONLINE

</text>
