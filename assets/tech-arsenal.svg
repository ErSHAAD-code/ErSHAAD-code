<text x="585" y="460" class="h">☁️ CLOUD</text>
<text x="595" y="500" class="s">✓ Docker</text>
<text x="595" y="538" class="s">✓ GitHub</text>
<rect x="1060" y="420" width="420" height="250" rx="18" fill="#111827" stroke="url(#acc)"/>
